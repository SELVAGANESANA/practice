<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Payment Integration</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        #rzp-button1 {
            background-color: #3399cc;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #rzp-button1:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div>
        <h2>Razorpay Payment Demo</h2>
        <p>Click the button below to make a payment of ₹99.00</p>
        <button id="rzp-button1">Pay ₹99.00</button>
    </div>

    <script>
        var options = {
            "key": "rzp_test_1DP5mmOlF5G5ag", // Replace with your actual Key ID from Dashboard
            "amount": "9900", // Amount is in currency subunits (paise). 9900 paise = ₹99.00
            "currency": "INR",
            "name": "Training", // Your business name
            "description": "Test Transaction",
            "image": "https://example.com/your_logo", // Add your logo URL
            "order_id": "order_9A33XWu170gUtm", // This should be dynamically generated from your backend
            "handler": function (response) {
                // Success callback
                console.log('Payment successful:', response);
                alert('Payment Successful!');
                alert('Payment ID: ' + response.razorpay_payment_id);
                alert('Order ID: ' + response.razorpay_order_id);
                alert('Signature: ' + response.razorpay_signature);
                
                // Here you should verify the payment on your backend
                // Send these details to your backend for verification
            },
            "prefill": {
                "name": "Selva", // Customer's name
                "email": "selvaa0@gmail.com", 
                "contact": "+917010093001" // Customer's phone number
            },
            "notes": {
                "address": "Razorpay Corporate Office"
            },
            "theme": {
                "color": "#3399cc"
            }
        };

        var rzp1 = new Razorpay(options);

        // Payment failure handler
        rzp1.on('payment.failed', function (response) {
            console.error('Payment failed:', response.error);
            alert('Payment Failed!');
            alert('Error Code: ' + response.error.code);
            alert('Error Description: ' + response.error.description);
            alert('Error Source: ' + response.error.source);
            alert('Error Step: ' + response.error.step);
            alert('Error Reason: ' + response.error.reason);
            
            if (response.error.metadata) {
                alert('Order ID: ' + response.error.metadata.order_id);
                alert('Payment ID: ' + response.error.metadata.payment_id);
            }
        });

        // Button click handler
        document.getElementById('rzp-button1').onclick = function(e) {
            rzp1.open();
            e.preventDefault();
        };
    </script>
</body>
</html>
